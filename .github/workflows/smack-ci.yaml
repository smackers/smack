name: SMACK CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # The dependency image is addressed by the contents of its complete recipe.
  # This producer publishes it once when the recipe changes, then the matrix
  # jobs pull that immutable tag instead of installing dependencies themselves.
  prepare-ci-image:
    name: prepare CI dependency image
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-dependencies
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: image
        shell: bash
        run: |
          recipe_hash=$(sha256sum .github/ci/Dockerfile bin/build.sh bin/versions | sha256sum | cut -c1-64)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smack-ci-deps:ubuntu-24.04-${recipe_hash}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether image already exists
        id: published
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a maintainer to publish images for fork changes
        if: >-
          steps.published.outputs.exists == 'false' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          echo "::error::${IMAGE} does not exist. A maintainer must publish dependency images changed by fork pull requests."
          exit 1

      - name: Set up Docker Buildx
        if: steps.published.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish dependency image
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/ci/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=ci-dependencies
          cache-to: type=gha,mode=max,scope=ci-dependencies

  # Formatting is a property of the tree, not of any one test folder, so it runs
  # once per CI run instead of once per matrix entry. bin/build.sh stays the
  # single source of truth for how the tools are installed -- it pins
  # clang-format to LLVM_SHORT_VERSION from bin/versions -- but every phase
  # except the dev dependencies is switched off, so this job installs no LLVM,
  # dotnet, or Boost packages, downloads no solvers, and compiles nothing.
  check-format:
    name: check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: install formatting tools
        env:
          INSTALL_DEPENDENCIES: 0
          INSTALL_Z3: 0
          INSTALL_BOOGIE: 0
          INSTALL_CORRAL: 0
          BUILD_SMACK: 0
          TEST_SMACK: 0
          INSTALL_DEV_DEPENDENCIES: 1
          GITHUB_ACTIONS: true
        run: |
          sudo apt-get update
          ./bin/build.sh

      - name: run formatters
        run: |
          ./format/run-clang-format.py -r lib/smack include/smack tools share/smack/include share/smack/lib test examples
          flake8 test/regtest.py share/smack/ --extend-exclude share/smack/svcomp/,share/smack/reach.py

  # Compile the checked-out revision once and pass the relocatable install tree
  # to every regression shard. The dependency image deliberately contains no
  # repository source, so changing SMACK still invalidates this artifact.
  build-smack:
    name: build SMACK
    needs: prepare-ci-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        CARGO_HOME: /root/.cargo
        RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v7

      - name: prepare mounted Actions workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          touch "$GITHUB_WORKSPACE/../smack.environment"

      - name: compile and install
        env:
          INSTALL_DEPENDENCIES: 0
          INSTALL_RUST: 0
          INSTALL_Z3: 0
          INSTALL_BOOGIE: 0
          INSTALL_CORRAL: 0
          TEST_SMACK: 0
        run: ./bin/build.sh --prefix "$GITHUB_WORKSPACE/smack-install"

      # upload-artifact does not preserve executable bits, so preserve the
      # install tree in a tar archive before handing it to the matrix.
      - name: package install tree
        run: tar -czf smack-install.tar.gz smack-install

      - uses: actions/upload-artifact@v6
        with:
          name: smack-install
          path: smack-install.tar.gz
          if-no-files-found: error
          retention-days: 1

  check-regressions:
    needs: [prepare-ci-image, build-smack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        # Actions overrides HOME inside job containers. Keep rustup pointed at
        # the toolchain baked under root's real home directory.
        CARGO_HOME: /root/.cargo
        RUSTUP_HOME: /root/.rustup
    strategy:
      matrix:
        regtest_env:
          [
            "--exhaustive --folder=c/basic",
            "--exhaustive --folder=c/data",
            "--exhaustive --folder=c/ntdrivers-simplified",
            "--exhaustive --folder=c/ntdrivers",
            "--exhaustive --folder=c/bits",
            "--exhaustive --folder=c/float",
            "--exhaustive --folder=c/locks",
            "--exhaustive --folder=c/contracts",
            "--exhaustive --folder=c/simd",
            "--exhaustive --folder=c/memory-safety",
            "--exhaustive --folder=c/pthread",
            "--exhaustive --folder=c/pthread_extras",
            "--exhaustive --folder=c/strings",
            "--exhaustive --folder=c/special",
            "--exhaustive --folder=c/targeted-checks",
            "--exhaustive --folder=c/unroll",
            "--exhaustive --folder=rust/array --languages=rust",
            "--exhaustive --folder=rust/basic --languages=rust",
            "--exhaustive --folder=rust/box --languages=rust",
            "--exhaustive --folder=rust/functions --languages=rust",
            "--exhaustive --folder=rust/generics --languages=rust",
            "--exhaustive --folder=rust/loops --languages=rust",
            "--exhaustive --folder=rust/panic --languages=rust",
            "--exhaustive --folder=rust/recursion --languages=rust",
            "--exhaustive --folder=rust/structures --languages=rust",
            "--exhaustive --folder=rust/targeted-checks",
            "--exhaustive --folder=rust/vector --languages=rust",
            # TODO: Cargo tests are currently disabled because of Rust version being too low
            # "--exhaustive --folder=rust/cargo/** --languages=cargo --threads=1",
            "--exhaustive --folder=llvm --languages=llvm-ir"
          ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: smack-install

      - name: unpack SMACK
        run: tar -xzf smack-install.tar.gz

      # The mounted workspace belongs to the host runner UID, while this image
      # runs as root. checkout's temporary HOME does not carry its safe-directory
      # setting into later container steps.
      - name: prepare mounted Actions workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image supplies dependencies and the artifact supplies the one build
      # of this revision. Each matrix entry now runs only its assigned tests.
      - name: test
        env:
          REGTEST_ENV: ${{ matrix.regtest_env }}
          INSTALL_DEPENDENCIES: 0
          INSTALL_RUST: 0
          INSTALL_Z3: 0
          INSTALL_BOOGIE: 0
          INSTALL_CORRAL: 0
          BUILD_SMACK: 0
        run: |
          export PATH="$GITHUB_WORKSPACE/smack-install/bin:$PATH"
          ./bin/build.sh

  build-and-push-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [check-format, build-smack, check-regressions]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Set tag name
        shell: bash
        id: set_tag
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "docker_tag=stable" >> "$GITHUB_OUTPUT"
          else
            echo "docker_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: smackers/smack:${{ steps.set_tag.outputs.docker_tag }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
